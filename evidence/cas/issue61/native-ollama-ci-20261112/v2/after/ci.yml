name: CI
run-name: Worker Pool CI · ${{ github.event_name }} · ${{ github.event.comment.id || github.run_id }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_merge_sha:
        description: "Expected merged main commit SHA for governed follow-up"
        required: false
        type: string
      expected_merge_pr:
        description: "Merged pull request number for governed follow-up"
        required: false
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: engineering-worker-pool-ci-${{ github.event_name == 'issue_comment' && 'native-validation' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'issue_comment' }}

jobs:
  test:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.action == 'created' &&
        github.actor == 'ericson-j-santos' &&
        github.event.repository.full_name == 'ericson-j-santos/engineering-worker-pool' &&
        github.event.repository.private == false &&
        github.event.issue.number == 13 &&
        github.event.issue.state == 'open' &&
        !github.event.issue.pull_request &&
        github.event.comment.user.login == 'ericson-j-santos' &&
        github.event.comment.user.type == 'User' &&
        github.event.comment.body == '/worker validate'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm immutable checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify explicitly dispatched post-merge SHA
        if: github.event_name == 'workflow_dispatch' && inputs.expected_merge_sha != ''
        env:
          EXPECTED_MERGE_SHA: ${{ inputs.expected_merge_sha }}
          EXPECTED_MERGE_PR: ${{ inputs.expected_merge_pr }}
        run: node scripts/verify_postmerge_dispatch.cjs
      - name: Admit exact owner comment
        if: github.event_name == 'issue_comment'
        run: python -m app.ci_entrypoint
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install reviewed Agent Core RAG dependency (exact commit)
        run: python -m pip install -r requirements-rag.txt
      - name: Compile
        run: python -m compileall -q app tests scripts/local_worker_e2e.py scripts/structured_worker_e2e.py scripts/structured_acceptance.py scripts/native_gateway_preflight_e2e.py
      - name: Test
        run: python -m pytest -q
      - name: Verify native Ollama admission and failure-path regressions
        run: python -m pytest -q tests/test_native_ollama_ci.py tests/test_native_ollama_ci_cleanup.py
      - name: Execute pinned Agent Core RAG contract tests
        run: python -m pytest -q tests/rag_contract_check.py tests/issue_rag_contract_check.py
      - name: Install pinned GitHub OIDC verifier
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix services/continuity_identity
      - name: Verify private identity admission controls
        run: node --test services/continuity_identity/identity.test.mjs
      - name: Verify fail-closed governed merge policy
        run: node --test tests/test_governed_auto_merge.cjs

      - name: Checkout approved Worker Pool source for issue8 CAS readback
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/issue8-runtime-cas-readback-20261026'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/engineering-worker-pool
          ref: 87a8de64ea5ed2e4aef1a9cde51861edb61ffe5e
          fetch-depth: 0
          path: _issue8_source
          persist-credentials: false

      - name: Revalidate existing Qwen issue8 runtime CAS on independent hosted checkout
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/issue8-runtime-cas-readback-20261026'
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.issue8_runtime_cas_readback --source-root _issue8_source

      - name: Checkout canonical rules for disposable E2E
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: 6cd74b32a24810cae7213744b697564e00be8b25
          path: _rules
          persist-credentials: false

      - name: Checkout pinned current Gateway rules for native session E2E
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ddd09dc616181c0aaf46d33a194e9b00a6989332
          path: _rules_native
          persist-credentials: false

      - name: Test native boundary against actual pinned Command Gateway
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 2
        run: python scripts/native_gateway_preflight_e2e.py --rules-scripts _rules_native/scripts

      - name: Verify remote composition and read-only result replay
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 2
        run: python scripts/remote_native_composition_e2e.py --rules-scripts _rules_native/scripts

      - name: Start isolated native Ollama and pin Qwen 1.5B
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 12
        run: |
          python scripts/native_ollama_ci.py start
          python scripts/native_ollama_ci.py initial

      - name: Execute governed queue to local-code E2E
        id: code_e2e
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 5
        run: python scripts/local_worker_e2e.py

      - name: Switch to pinned native Qwen 7B without Docker
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 16
        run: python scripts/native_ollama_ci.py structured

      - name: Real GitHub evidence to native local Qwen7B E2E (read-only)
        id: rag_e2e
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NATIVE_OLLAMA_DEV: '1'
          NATIVE_MODEL_DIGEST_PREFIX: 'dae161e27b0e'
        run: python -m scripts.rag_real_qwen_e2e

      - name: Real issue8 Qwen7B acceptance citation with independent GitHub readback
        id: issue_rag_e2e
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NATIVE_OLLAMA_DEV: '1'
          NATIVE_MODEL_DIGEST_PREFIX: 'dae161e27b0e'
        run: python -m scripts.issue_rag_real_qwen_e2e

      - name: Repair real structured function in governed copy
        id: structured_e2e
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 8
        run: python scripts/structured_worker_e2e.py

      - name: Stop only the native model process owned by this CI
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 2
        run: python scripts/native_ollama_ci.py stop

      - name: Preserve SHA-bound E2E evidence in job logs (no artifact storage)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: python scripts/ci_evidence_log.py

      - name: Record native validation receipt
        if: always()
        shell: bash
        env:
          VALIDATION_RESULT: ${{ job.status }}
          COMMENT_ID: ${{ github.event.comment.id }}
          LOCAL_CODE_E2E: ${{ steps.code_e2e.outcome }}
          STRUCTURED_E2E: ${{ steps.structured_e2e.outcome }}
          RAG_E2E: ${{ steps.rag_e2e.outcome }}
          ISSUE_RAG_E2E: ${{ steps.issue_rag_e2e.outcome }}
        run: |
          {
            echo "## Worker Pool native CI"
            echo "SHA: $EXPECTED_SHA"
            echo "Event: $GITHUB_EVENT_NAME"
            echo "Comment: $COMMENT_ID"
            echo "Run: $GITHUB_RUN_ID"
            echo "Result: $VALIDATION_RESULT"
            echo "Physical hosts touched: false"
            echo "Product tasks dispatched: false"
            echo "Local-code E2E: $LOCAL_CODE_E2E"
            echo "Structured-code E2E: $STRUCTURED_E2E"
            echo "Agentic RAG read-only E2E: $RAG_E2E"
            echo "Issue8 RAG single-claim E2E: $ISSUE_RAG_E2E"
            echo "Evidence: lossless SHA-bound capsules in job logs; no artifact uploads or pip cache"
          } >> "$GITHUB_STEP_SUMMARY"
