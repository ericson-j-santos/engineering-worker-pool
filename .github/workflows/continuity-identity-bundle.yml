name: Continuity identity bundle

on:
  push:
    branches:
      - main
    paths:
      - "services/continuity_identity/**"
      - "scripts/build_continuity_identity.py"
      - ".github/workflows/continuity-identity-bundle.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout immutable main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Confirm exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Install pinned broker dependency
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix services/continuity_identity

      - name: Verify broker identity contracts
        shell: bash
        run: node --test services/continuity_identity/identity.test.mjs

      - name: Build and verify deterministic bundle
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/continuity-identity-build.json"
          python scripts/build_continuity_identity.py > "$metadata"
          METADATA="$metadata" python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          from pathlib import Path

          metadata = json.loads(Path(os.environ["METADATA"]).read_text())
          bundle = Path(".tmp/continuity-identity.zip")
          payload = bundle.read_bytes()
          assert metadata["result"] == "IDENTITY_BUNDLE_BUILT"
          assert metadata["bytes"] == len(payload)
          assert metadata["sha256"] == hashlib.sha256(payload).hexdigest()
          assert stat.S_IMODE(bundle.stat().st_mode) == 0o600
          assert 0 < len(payload) < 10_000_000
          print(json.dumps({
              "result": "IDENTITY_BUNDLE_VERIFIED",
              "bytes": len(payload),
              "sha256": metadata["sha256"],
              "source_sha": os.environ["EXPECTED_SHA"],
          }, sort_keys=True))
          PY

      - name: Upload short-lived code-only bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuity-identity-${{ env.EXPECTED_SHA }}
          path: .tmp/continuity-identity.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
