name: Pre-PR Schema Contract (not READY_FOR_PR)

on:
  push:
    branches:
      - feat/pre-pr-gate-issue61-20261108
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: pre-pr-gate-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Compile route and tests
        run: python -m py_compile app/pre_pr_gate.py app/prepr_evidence_gate.py app/prepr_github_readback.py scripts/prepr_live_github_readback.py tests/test_pre_pr_gate.py tests/test_prepr_evidence_gate.py tests/test_prepr_github_readback.py

      - name: Validate SHA-bound Noteri request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app.pre_pr_gate import validate_request
          request = json.loads(Path("requests/noteri-42-pre-pr.json").read_text())
          checked = validate_request(request)
          assert checked["head_sha"] == "515ede49cc7a8b80609c64ef76c23372239a637f"
          PY

      - name: Run positive, negative and replay contract
        run: python -m unittest -v tests.test_pre_pr_gate

      - name: Verify canonical CAS envelope contract (synthetic only)
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2 httpx==0.28.1
          python -m pytest -q tests/test_prepr_evidence_gate.py tests/test_prepr_github_readback.py

      - name: Authenticated live GitHub source readback (not READY)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.prepr_live_github_readback

      - name: Persist SHA-bound contract status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACT_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_SHA" \
            -f state="$CONTRACT_STATE" \
            -f context="pre-pr-gate/schema-only" \
            -f description="Schema-only: no independent CAS, model or PR authorization"

      - name: Record bounded evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Generic pre-PR gate contract"
            echo "SHA: $EXPECTED_SHA"
            echo "Result: ${{ job.status }}"
            echo "Bound request: noteri-runtime#42 / TODO-54 / 515ede49cc7a8b80609c64ef76c23372239a637f"
            echo "Model executed: false (contract validation only)"
            echo "READY_FOR_PR: false (self-reported JSON is not authority)"
            echo "Draft PR authorized: false"
            echo "CAS written: false"
            echo "Draft PR created: false"
            echo "Merge authorized: false"
            echo "Physical host touched: false"
            echo "Artifact upload: false"
          } >> "$GITHUB_STEP_SUMMARY"

  independent-source-readback:
    if: github.repository == 'ericson-j-santos/engineering-worker-pool' && github.event.repository.private == false
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact checkout and replay fail-closed tests
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m pip install --disable-pip-version-check pytest==8.4.2 httpx==0.28.1
          python -m pytest -q tests/test_prepr_evidence_gate.py tests/test_prepr_github_readback.py
          python -m unittest -q tests.test_pre_pr_gate
          echo PREPR_SCHEMA_CAS_AND_OFFICIAL_GITHUB_HTTP_CONTRACT_OK_NO_READY_FOR_PR

      - name: Independent authenticated GitHub readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.prepr_live_github_readback
