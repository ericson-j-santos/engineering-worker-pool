        run: >-
          sudo -n --preserve-env="$EWP_CONTEXT_ENV" /usr/bin/python3 -B "$EWP_RULES_ROOT/scripts/command_gateway.py" --policy "$EWP_RULES_ROOT/config/command-gateway.policy.posix.json" --correlation-id "$EWP_CORRELATION" run --cwd "$EWP_WORKTREE" --session-id "$EWP_SESSION" --risk 2 --timeout 300 --expected-head "$EXPECTED_SHA" -- "$EWP_VENV/bin/python" -B "$EWP_RULES_ROOT/scripts/set_owner_risk3_development_mode.py"
          --config "$EWP_OWNER_CONFIG" --disable --confirm DISABLE-RISK3-DEV-MODE
      - name: Authorize only the versioned consumer action
        run: >-
          sudo -n --preserve-env="$EWP_CONTEXT_ENV" "$EWP_VENV/bin/python" -B "$EWP_RULES_ROOT/scripts/set_owner_risk3_action.py"
          --config "$EWP_OWNER_CONFIG"
