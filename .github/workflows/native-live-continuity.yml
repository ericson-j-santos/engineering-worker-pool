      - name: Canonical native host bootstrap
        run: >-
          sudo -n --preserve-env="$EWP_CONTEXT_ENV" /usr/bin/python3 -B "$GITHUB_WORKSPACE/.canonical-rules/scripts/install_command_gateway_host.py"
          --commit 0757b9bcbc1e54ef9a1f081069f3b05ac0690062
          --expected-self-sha256 73ef3c091a16a261dfe71fa0ac7bb2e2c6a7f07bdfa3bc592c44855751c92329
          --install-root /workspace/.reqsys-command-gateway-install
          --work-root /workspace/.chatgpt-workers
      - name: Materialize governed application session
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: >-
          sudo -n --preserve-env="$EWP_CONTEXT_ENV,GIT_CONFIG_COUNT,GIT_CONFIG_KEY_0,GIT_CONFIG_VALUE_0" /usr/bin/python3 -B "$EWP_RULES_ROOT/scripts/session_launcher.py" --policy "$EWP_RULES_ROOT/config/command-gateway.policy.posix.json" --repo "$GITHUB_WORKSPACE" --session-id "$EWP_SESSION" --correlation-id "$EWP_CORRELATION" --expected-head "$EXPECTED_SHA" --sync-ref origin/feat/hosted-cold-checkpoint-resume-20261020
      - name: Create isolated native interpreter through Gateway
