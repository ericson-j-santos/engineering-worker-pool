name: Native live continuity
run-name: Shared authority and private S3 · ${{ github.sha }}
on:
  push:
    branches: [feat/hosted-cold-checkpoint-resume-20261020]

permissions:
  contents: read
  id-token: write

concurrency:
  group: native-live-continuity-dev-authority-v1
  cancel-in-progress: false

env:
  EWP_CONTEXT_ENV: 'REQSYS_WORKSPACE_ROOT,REQSYS_GATEWAY_STATE_DIR,PYTHONDONTWRITEBYTECODE,PYTHONNOUSERSITE,GITHUB_ACTIONS,GITHUB_WORKSPACE,GITHUB_REPOSITORY,GITHUB_REPOSITORY_OWNER,GITHUB_ACTOR,GITHUB_SHA,GITHUB_REF,GITHUB_REF_NAME,GITHUB_EVENT_NAME,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_NAME,EXPECTED_SHA,EXPECTED_RULES_SHA,EWP_SESSION,EWP_CORRELATION,EWP_PHASE,EWP_RULES_ROOT,EWP_WORKTREE,EWP_VENV,EWP_NATIVE_ROOT,EWP_PUBLIC_ROOT,EWP_OWNER_CONFIG'
  REQSYS_WORKSPACE_ROOT: /workspace
  REQSYS_GATEWAY_STATE_DIR: /workspace/.reqsys-command-gateway-posix
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'
  EXPECTED_SHA: ${{ github.sha }}
  EXPECTED_RULES_SHA: 0757b9bcbc1e54ef9a1f081069f3b05ac0690062
  EWP_RULES_ROOT: /workspace/.chatgpt-workers/operational-rules-validation
  EWP_OWNER_CONFIG: /workspace/.reqsys-command-gateway-posix/native-owner-risk3/owner-risk3-exceptions.local.json

jobs:

  producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      EWP_PHASE: producer
      EWP_SESSION: live-ewp-${{ github.run_id }}-${{ github.run_attempt }}-a
      EWP_CORRELATION: live-ewp-${{ github.run_id }}-${{ github.run_attempt }}-a
      EWP_WORKTREE: /workspace/.chatgpt-workers/wt-chat-live-ewp-${{ github.run_id }}-${{ github.run_attempt }}-a
      EWP_VENV: /workspace/.chatgpt-workers/live-venv-${{ github.run_id }}-${{ github.run_attempt }}-a
      EWP_NATIVE_ROOT: /workspace/.chatgpt-workers/native-${{ github.run_id }}-${{ github.run_attempt }}-a
      EWP_PUBLIC_ROOT: /workspace/.chatgpt-workers/native-public-${{ github.run_id }}-${{ github.run_attempt }}-a
    steps:
      - name: Checkout exact application commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout exact bootstrap source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: 0757b9bcbc1e54ef9a1f081069f3b05ac0690062
          path: .canonical-rules
          persist-credentials: false
      - name: Canonical native host bootstrap
        run: >-
          sudo -n --preserve-env="$EWP_CONTEXT_ENV" /usr/bin/python3 -B "$GITHUB_WORKSPACE/.canonical-rules/scripts/install_command_gateway_host.py"
          --commit 0757b9bcbc1e54ef9a1f081069f3b05ac0690062
          --expected-self-sha256 73ef3c091a16a261dfe71fa0ac7bb2e2c6a7f07bdfa3bc592c44855751c92329
          --install-root /workspace/.reqsys-command-gateway-install
          --work-root /workspace/.chatgpt-workers
      - name: Materialize governed application session
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: >-
          sudo -n --preserve-env="$EWP_CONTEXT_ENV,GIT_CONFIG_COUNT,GIT_CONFIG_KEY_0,GIT_CONFIG_VALUE_0" /usr/bin/python3 -B "$EWP_RULES_ROOT/scripts/session_launcher.py" --policy "$EWP_RULES_ROOT/config/command-gateway.policy.posix.json" --repo "$GITHUB_WORKSPACE" --session-id "$EWP_SESSION" --correlation-id "$EWP_CORRELATION" --expected-head "$EXPECTED_SHA" --sync-ref origin/feat/hosted-cold-checkpoint-resume-20261020
      - name: Create isolated native interpreter through Gateway
        run: >-
          sudo -n --preserve-env="$EWP_CONTEXT_ENV" /usr/bin/python3 -B "$EWP_RULES_ROOT/scripts/command_gateway.py" --policy "$EWP_RULES_ROOT/config/command-gateway.policy.posix.json" --correlation-id "$EWP_CORRELATION" run --cwd "$EWP_WORKTREE" --session-id "$EWP_SESSION" --risk 2 --timeout 300 --expected-head "$EXPECTED_SHA" -- /usr/bin/python3 -m venv "$EWP_VENV"
      - name: Install pinned dependencies through Gateway
        run: >-
          sudo -n --preserve-env="$EWP_CONTEXT_ENV" /usr/bin/python3 -B "$EWP_RULES_ROOT/scripts/command_gateway.py" --policy "$EWP_RULES_ROOT/config/command-gateway.policy.posix.json" --correlation-id "$EWP_CORRELATION" run --cwd "$EWP_WORKTREE" --session-id "$EWP_SESSION" --risk 2 --timeout 300 --expected-head "$EXPECTED_SHA" -- "$EWP_VENV/bin/python" -m pip install --disable-pip-version-check --no-input -r requirements-postgres.txt
      - name: Initialize exact DEV exception with broad mode disabled
        id: broad_disabled
        run: >-
          sudo -n --preserve-env="$EWP_CONTEXT_ENV" /usr/bin/python3 -B "$EWP_RULES_ROOT/scripts/command_gateway.py" --policy "$EWP_RULES_ROOT/config/command-gateway.policy.posix.json" --correlation-id "$EWP_CORRELATION" run --cwd "$EWP_WORKTREE" --session-id "$EWP_SESSION" --risk 2 --timeout 300 --expected-head "$EXPECTED_SHA" -- "$EWP_VENV/bin/python" -B "$EWP_RULES_ROOT/scripts/set_owner_risk3_development_mode.py"
          --config "$EWP_OWNER_CONFIG" --disable --confirm DISABLE-RISK3-DEV-MODE
      - name: Authorize only the versioned producer action
        run: >-
          sudo -n --preserve-env="$EWP_CONTEXT_ENV" "$EWP_VENV/bin/python" -B "$EWP_RULES_ROOT/scripts/set_owner_risk3_action.py"
          --config "$EWP_OWNER_CONFIG"
          --action-id ewp.native.continuity.producer
          --scope repo://engineering-worker-pool/environment/dev/native-continuity
          --environment dev --repo-root "$EWP_WORKTREE" --expected-head "$EXPECTED_SHA"
          --script scripts/native_live_driver.py
          --arg=--phase --arg=producer
          --arg=--root --arg="$EWP_NATIVE_ROOT"
          --arg=--rules-root --arg="$EWP_RULES_ROOT"
          --expires-minutes 30
          --authorization-ref github://ericson-j-santos/engineering-worker-pool/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          --confirm AUTHORIZE-SPECIFIC-RISK3-ACTION
      - name: Refresh exact session attestation before private intake
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: >-
          sudo -n --preserve-env="$EWP_CONTEXT_ENV,GIT_CONFIG_COUNT,GIT_CONFIG_KEY_0,GIT_CONFIG_VALUE_0" /usr/bin/python3 -B "$EWP_RULES_ROOT/scripts/session_launcher.py" --policy "$EWP_RULES_ROOT/config/command-gateway.policy.posix.json" --repo "$GITHUB_WORKSPACE" --session-id "$EWP_SESSION" --correlation-id "$EWP_CORRELATION" --expected-head "$EXPECTED_SHA" --sync-ref origin/feat/hosted-cold-checkpoint-resume-20261020
      - name: Execute exact producer through Owner Risk3 Gateway
        id: execute
        timeout-minutes: 15
        run: >-
          sudo -n --preserve-env="$EWP_CONTEXT_ENV,ACTIONS_ID_TOKEN_REQUEST_URL,ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          "$EWP_VENV/bin/python" -B "$EWP_RULES_ROOT/scripts/owner_risk3_gateway.py"
          --config "$EWP_OWNER_CONFIG" --action-id ewp.native.continuity.producer
          --scope repo://engineering-worker-pool/environment/dev/native-continuity
          --cwd "$EWP_WORKTREE" --timeout 900 --correlation-id "$EWP_CORRELATION"
      - name: Read bounded public continuity receipt through Gateway
        if: always() && steps.execute.outcome != 'skipped'
        run: >-
          sudo -n --preserve-env="$EWP_CONTEXT_ENV" /usr/bin/python3 -B "$EWP_RULES_ROOT/scripts/command_gateway.py" --policy "$EWP_RULES_ROOT/config/command-gateway.policy.posix.json" --correlation-id "$EWP_CORRELATION" run --cwd "$EWP_WORKTREE" --session-id "$EWP_SESSION" --risk 1 --timeout 300 --expected-head "$EXPECTED_SHA" -- "$EWP_VENV/bin/python" -m json.tool --compact "$EWP_PUBLIC_ROOT/receipt.json"
      - name: Read back broad DEV mode remains disabled
        if: always() && steps.broad_disabled.outcome == 'success'
        run: >-
          sudo -n --preserve-env="$EWP_CONTEXT_ENV" /usr/bin/python3 -B "$EWP_RULES_ROOT/scripts/command_gateway.py" --policy "$EWP_RULES_ROOT/config/command-gateway.policy.posix.json" --correlation-id "$EWP_CORRELATION" run --cwd "$EWP_WORKTREE" --session-id "$EWP_SESSION" --risk 1 --timeout 300 --expected-head "$EXPECTED_SHA" -- "$EWP_VENV/bin/python" -B "$EWP_RULES_ROOT/scripts/set_owner_risk3_development_mode.py"
          --config "$EWP_OWNER_CONFIG" --status

  consumer:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      EWP_PHASE: consumer
      EWP_SESSION: live-ewp-${{ github.run_id }}-${{ github.run_attempt }}-b
      EWP_CORRELATION: live-ewp-${{ github.run_id }}-${{ github.run_attempt }}-b
      EWP_WORKTREE: /workspace/.chatgpt-workers/wt-chat-live-ewp-${{ github.run_id }}-${{ github.run_attempt }}-b
      EWP_VENV: /workspace/.chatgpt-workers/live-venv-${{ github.run_id }}-${{ github.run_attempt }}-b
      EWP_NATIVE_ROOT: /workspace/.chatgpt-workers/native-${{ github.run_id }}-${{ github.run_attempt }}-b
      EWP_PUBLIC_ROOT: /workspace/.chatgpt-workers/native-public-${{ github.run_id }}-${{ github.run_attempt }}-b
    steps:
      - name: Checkout exact application commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout exact bootstrap source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
