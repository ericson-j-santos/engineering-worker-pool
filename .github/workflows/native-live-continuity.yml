          --arg=--rules-root --arg="$EWP_RULES_ROOT"
          --expires-minutes 30
          --authorization-ref github://ericson-j-santos/engineering-worker-pool/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
