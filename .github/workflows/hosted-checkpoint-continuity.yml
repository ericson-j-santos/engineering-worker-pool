name: Hosted cold checkpoint continuity
on:
  push:
    branches: [feat/hosted-cold-checkpoint-resume-20261020]
  pull_request:
    paths:
      - scripts/hosted_checkpoint_continuity.py
      - tests/test_hosted_checkpoint_continuity.py
      - .github/workflows/hosted-checkpoint-continuity.yml
permissions:
  contents: read
concurrency:
  group: hosted-cold-continuity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  producer:
    if: github.repository == 'ericson-j-santos/engineering-worker-pool' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      capsule: ${{ steps.checkpoint.outputs.capsule }}
      checksum: ${{ steps.checkpoint.outputs.checksum }}
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: a430688c499077f5472841560f224c40766b0b78
          path: _rules
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install repository test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile immutable source and test capsule controls
        run: |
          python -m compileall -q app scripts/hosted_checkpoint_continuity.py tests
          python -m pytest -ra tests/test_hosted_checkpoint_continuity.py
      - name: Complete deterministic regression before PR
        run: python -m pytest -ra
      - name: Validate governed merge policy
        run: node --test tests/test_governed_auto_merge.cjs
      - name: Export disposable checkpoint after stopping its isolated service
        id: checkpoint
        run: python -B scripts/hosted_checkpoint_continuity.py --stage producer --rules-scripts _rules/scripts
  consumer:
    needs: producer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: a430688c499077f5472841560f224c40766b0b78
          path: _rules
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install repository test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Restore same task and reject the old generation on another runner
        env:
          COLD_CAPSULE: ${{ needs.producer.outputs.capsule }}
          COLD_CHECKSUM: ${{ needs.producer.outputs.checksum }}
        run: python -B scripts/hosted_checkpoint_continuity.py --stage consumer --rules-scripts _rules/scripts
