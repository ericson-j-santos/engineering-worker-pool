name: Ollama transport contract (native, no containers)

on:
  push:
    branches:
      - feature/desktop-ollama-http-admission-20261114
    paths:
      - app/ollama_transport_repair_profile.py
      - tests/test_ollama_transport_repair_profile.py
      - .github/workflows/ollama-transport-native-profile.yml
  pull_request:
    paths:
      - app/ollama_transport_repair_profile.py
      - tests/test_ollama_transport_repair_profile.py
      - .github/workflows/ollama-transport-native-profile.yml

permissions:
  contents: read

jobs:
  native-static-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Exact SHA checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject SHA drift
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile contract and tests
        run: python -m py_compile app/ollama_transport_repair_profile.py tests/test_ollama_transport_repair_profile.py
      - name: Positive, negative, replay and security policy tests
        run: python -m unittest discover -s tests -p 'test_ollama_transport_repair_profile.py' -v
