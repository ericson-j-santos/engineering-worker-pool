name: Issue61 CAS independent Python contract tests
run-name: Issue61 CAS independent pytest · ${{ github.sha }}

on:
  push:
    branches:
      - cas/issue61-gate-contract-20261111-v1
    paths:
      - .github/workflows/issue61-cas-independent-pytest.yml
      - scripts/issue61_cas_validator.py
      - tests/test_issue61_cas_validator.py

permissions:
  contents: read

concurrency:
  group: ewp61-cas-check-20261111
  cancel-in-progress: false

jobs:
  verify:
    name: CAS readback and independent Python pytest (no publication)
    if: >-
      github.repository == 'ericson-j-santos/engineering-worker-pool' &&
      github.ref == 'refs/heads/cas/issue61-gate-contract-20261111-v1' &&
      github.actor == 'ericson-j-santos'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_NO_CACHE_DIR: '1'
      EXPECTED_ARTIFACT_SHA256: dcb44976e3fcb77251d0cf5f19fa56053aaeb1ae3015a8eb97c1985289841289
      EXPECTED_SOURCE_SHA: 2504c5e123f6e7cd607ea77fde80cbebf46d2790
      EXPECTED_PRODUCED_SHA: 90f79146deec86b7d1265daf3bb9bb3b5879f3bd
    steps:
      - name: Checkout evidence ref by immutable event SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up standard Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify original CAS and materialize candidate in an isolated directory
        run: python scripts/issue61_cas_validator.py
      - name: Install pinned pytest without caching
        run: python -m pip install --disable-pip-version-check --no-cache-dir pytest==8.4.2
      - name: Compile verifier and exact recovered source/tests
        run: python -m compileall -q scripts/issue61_cas_validator.py tests/test_issue61_cas_validator.py .issue61-independent-checkout/app .issue61-independent-checkout/tests
      - name: Run hostile CAS and harness regression controls
        run: python -m pytest -q -p no:cacheprovider tests/test_issue61_cas_validator.py
      - name: Run focused positive, negative and idempotency tests on recovered bytes
        shell: bash
        run: |
          cd .issue61-independent-checkout
          python -m pytest -q -p no:cacheprovider tests/test_pre_pr_cas_gate.py
      - name: Report scope without granting READY_FOR_PR
        if: success()
        run: |
          echo "ISSUE61_CAS_PYTEST_PASSED"
          echo "MODEL_DIGEST_NOT_ATTESTED"
          echo "VALIDATOR_AUTHORITY_NOT_ATTESTED"
          echo "READY_FOR_PR=false"
          {
            echo "## Issue 61 — independent hosted validation (test only)"
            echo "- CAS SHA-256: $EXPECTED_ARTIFACT_SHA256"
            echo "- Produced commit: $EXPECTED_PRODUCED_SHA"
            echo "- Validator checkout SHA: $GITHUB_SHA"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- CAS readback + negative regression + isolated candidate pytest: PASSED"
            echo "- Builder model/digest: NOT ATTESTED"
            echo "- Authorized independent Validator identity: NOT ATTESTED"
            echo "- READY_FOR_PR: false"
          } >> "$GITHUB_STEP_SUMMARY"
