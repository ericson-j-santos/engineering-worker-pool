name: Issue 62 next_action bridge contract
on:
  push:
    branches: [feat/issue62-next-action-continuation-20261115]
    paths:
      - app/next_action_bridge.py
      - tests/test_next_action_bridge.py
      - tests/test_issue62_workflow_contract.py
      - scripts/issue62_continuation_gate.py
      - .github/workflows/issue62-governed-continuation.yml
      - .github/workflows/issue62-next-action-contract.yml

permissions:
  contents: read

concurrency:
  group: issue62-next-action-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-continuation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exact version checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Install only contract-test runtime
        run: python3 -m pip install --disable-pip-version-check --no-input --no-cache-dir --break-system-packages pytest==9.0.3 httpx==0.28.1 PyYAML==6.0.2
      - name: Validate source and negative/idempotent contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m compileall -q app/next_action_bridge.py scripts/issue62_continuation_gate.py tests/test_next_action_bridge.py tests/test_issue62_workflow_contract.py
          python3 -m pytest -q tests/test_next_action_bridge.py tests/test_issue62_workflow_contract.py
