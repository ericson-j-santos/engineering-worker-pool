name: Issue 62 governed continuation

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Canonical Worker Pool task id"
        required: true
        type: string
      request_id:
        description: "Expected request id"
        required: true
        type: string
      expected_issue:
        description: "Expected GitHub issue number"
        required: true
        type: string
      expected_base_sha:
        description: "Expected source SHA"
        required: true
        type: string
  repository_dispatch:
    types: [worker-pool-next-action]

permissions:
  contents: read

concurrency:
  group: issue62-continuation-${{ github.event.client_payload.task_id || inputs.task_id || github.sha }}
  cancel-in-progress: false

jobs:
  continuation:
    if: >-
      github.repository == 'ericson-j-santos/engineering-worker-pool' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'repository_dispatch' &&
        github.event.action == 'worker-pool-next-action'))
    runs-on: [self-hosted, pc24x7, runtime-dev]
    timeout-minutes: 10
    env:
      # Local service only. The token stays in an already-protected host file.
      # Remote origins and event-provided bearer values are forbidden.
      EWP_WORKER_POOL_PORT: ${{ vars.EWP_WORKER_POOL_PORT }}
      EWP_WORKER_POOL_TOKEN_FILE: ${{ vars.EWP_WORKER_POOL_TOKEN_FILE }}
      EWP_TASK_ID: ${{ github.event.client_payload.task_id || inputs.task_id }}
      EWP_EXPECTED_REPOSITORY: ericson-j-santos/engineering-worker-pool
      EWP_EXPECTED_ISSUE: ${{ github.event.client_payload.issue_number || inputs.expected_issue }}
      EWP_EXPECTED_REQUEST_ID: ${{ github.event.client_payload.request_id || inputs.request_id }}
      EWP_EXPECTED_BASE_SHA: ${{ github.event.client_payload.base_sha || inputs.expected_base_sha || github.sha }}
      EWP_EXPECTED_COST_ZERO_SHA: ${{ github.event.client_payload.cost_zero_sha || vars.EWP_COST_ZERO_CERTIFIED_SHA }}
      EWP_COST_ZERO_CERTIFIED_SHA: ${{ vars.EWP_COST_ZERO_CERTIFIED_SHA }}
      # This checkout pins workflow code, never an untrusted task source SHA.
      # The task base SHA is checked independently against canonical API state.
      EWP_CHECKED_OUT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout trusted workflow code SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate continuation gate
        run: python -B scripts/issue62_continuation_gate.py
