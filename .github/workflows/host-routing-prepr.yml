name: DEV routing pre-PR contract checks
on:
  push:
    branches:
      - feat/task-routing-pinned-or-pool-20261105
    paths:
      - app/store.py
      - app/main.py
      - app/work.py
      - app/postgres_authority.py
      - app/migrations/postgres_authority_v1.sql
      - tests/test_execution_routing.py
      - tests/test_api.py
      - tests/test_work_orchestrator.py
      - scripts/hosted_native_ollama_ci.py
      - scripts/local_worker_e2e.py
      - scripts/structured_worker_e2e.py
      - tests/test_hosted_native_ollama_ci.py
      - .github/workflows/host-routing-prepr.yml
permissions:
  contents: read
concurrency:
  group: host-routing-prepr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  route-contract:
    if: github.repository == 'ericson-j-santos/engineering-worker-pool'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify SHA-bound checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install reviewed dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax validation
        run: python -m compileall -q app tests
      - name: Routing positive, negative, replay and regression
        run: python -m pytest -q tests/test_execution_routing.py tests/test_store.py tests/test_api.py tests/test_work_orchestrator.py
      - name: Install reviewed exact-SHA Agent Core RAG dependency
        run: python -m pip install -r requirements-rag.txt
      - name: Full Python regression suite
        run: python -m pytest -q
      - name: Pinned Agent Core contract regression
        run: python -m pytest -q tests/rag_contract_check.py tests/issue_rag_contract_check.py
      - name: Install pinned identity verifier (no scripts or audit)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix services/continuity_identity
      - name: Verify private identity admission controls
        run: node --test services/continuity_identity/identity.test.mjs
      - name: Verify fail-closed governed merge policy
        run: node --test tests/test_governed_auto_merge.cjs

  windows-controls:
    if: github.repository == 'ericson-j-santos/engineering-worker-pool'
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify SHA-bound checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) {
            throw 'SHA_MISMATCH'
          }
      - name: Install reviewed dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax validation
        run: python -m compileall -q app tests
      - name: Exercise two Windows-only negative controls
        run: python -m pytest -q -rs tests/test_store_connection_cleanup.py::test_native_windows_real_file_removal_after_reader_close tests/test_native_remote_readback.py::test_windows_receipt_requires_protected_private_acl

  native-model-proof:
    # Isolated candidate; does not replace the existing PR E2E until proven.
    if: >-
      github.repository == 'ericson-j-santos/engineering-worker-pool' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable Worker Pool SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Checkout pinned historical Gateway fixture
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: 6cd74b32a24810cae7213744b697564e00be8b25
          path: _rules
          persist-credentials: false
      - name: Install reviewed Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install reviewed SHA-pinned Agent Core RAG dependency
        run: python -m pip install -r requirements-rag.txt
      - name: Validate native admission and RAG spoofing negative cases
        run: python -m pytest -q tests/test_hosted_native_ollama_ci.py
      - name: Native Qwen1.5B queue, Qwen7B repair and read-only PR RAG
        timeout-minutes: 22
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B scripts/hosted_native_ollama_ci.py
