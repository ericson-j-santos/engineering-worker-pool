name: Hosted checkpoint continuity rehearsal
run-name: Hosted continuity · PR ${{ github.event.pull_request.number }} · ${{ github.run_attempt }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/hosted_rehearsal.py
      - tests/test_hosted_rehearsal.py
      - config/hosted-rehearsal-gateway.json
      - .github/workflows/hosted-continuity-rehearsal.yml
      - docs/HOSTED_CONTINUITY_REHEARSAL.md

permissions:
  contents: read

concurrency:
  group: hosted-continuity-rehearsal-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  produce:
    if: >-
      github.repository == 'ericson-j-santos/engineering-worker-pool' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'ericson-j-santos' &&
      github.actor == 'ericson-j-santos'
    runs-on: ubuntu-24.04
    container:
      image: python:3.12.15-bookworm
      volumes:
        - /workspace
    timeout-minutes: 6
    outputs:
      capsule: ${{ steps.proof.outputs.capsule }}
      capsule_sha256: ${{ steps.proof.outputs.capsule_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      REQSYS_WORKSPACE_ROOT: /workspace
      REQSYS_GATEWAY_STATE_DIR: /workspace/.reqsys-command-gateway-posix
      REHEARSAL_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout immutable candidate without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Materialize pinned canonical governance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: a430688c499077f5472841560f224c40766b0b78
          path: .rehearsal-rules
          persist-credentials: false
      - name: Governed producer, interruption and checkpoint
        id: proof
        run: python -B scripts/hosted_rehearsal.py run-produce

  resume:
    needs: produce
    runs-on: ubuntu-24.04
    container:
      image: python:3.12.15-bookworm
      volumes:
        - /workspace
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      REQSYS_WORKSPACE_ROOT: /workspace
      REQSYS_GATEWAY_STATE_DIR: /workspace/.reqsys-command-gateway-posix
      REHEARSAL_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      REHEARSAL_CAPSULE: ${{ needs.produce.outputs.capsule }}
      REHEARSAL_CAPSULE_SHA256: ${{ needs.produce.outputs.capsule_sha256 }}
    steps:
      - name: Checkout same immutable candidate without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Materialize same pinned canonical governance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: a430688c499077f5472841560f224c40766b0b78
          path: .rehearsal-rules
          persist-credentials: false
      - name: Governed independent resume and stale-generation rejection
        run: python -B scripts/hosted_rehearsal.py run-resume
