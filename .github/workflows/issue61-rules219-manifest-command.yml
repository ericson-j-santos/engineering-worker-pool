name: Issue 61 Rules 219 manifest command contract

on:
  push:
    branches:
      - feat/issue61-rules219-manifest-command-20261116

permissions:
  contents: read

concurrency:
  group: issue61-rules219-command-contract
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'ericson-j-santos/engineering-worker-pool'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact SHA (read only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout reviewed Rules 219 fixture (independent repository)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: 40e3db3ef8b1fe367d79b878b8d9d91930d2337b
          path: _rules219_fixture
          persist-credentials: false
      - name: Verify exact independent Rules fixture SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _rules219_fixture rev-parse HEAD)" = "40e3db3ef8b1fe367d79b878b8d9d91930d2337b"
          test -f _rules219_fixture/scripts/builder_manifest_stage.py
          test -f _rules219_fixture/MANIFEST.json
      - name: Verify branch, ancestry, scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/feat/issue61-rules219-manifest-command-20261116"
          git merge-base --is-ancestor 2480ba050784959bd5873a3425d2643e21fcdae1 "$GITHUB_SHA"
          python3 - <<'PY'
          import subprocess
          expected = {
              "app/rules219_manifest_command.py",
              "tests/test_rules219_manifest_command.py",
              ".github/workflows/issue61-rules219-manifest-command.yml",
              "app/prepr_candidate_verifier.py",
              "tests/test_prepr_candidate_verifier.py",
              "app/native_one_shot.py",
              "app/rules213_native_adapter.py",
              "app/rules213_updater_profile.py",
              "tests/test_rules213_fenced_mandatory.py",
              "tests/test_rules213_native_adapter.py",
              "tests/test_rules213_updater_profile.py",
              "app/rules213_runtime_admission.py",
              "tests/test_rules213_runtime_admission.py",
              "app/noteri42_native_binding.py",
              "tests/test_noteri42_native_binding.py",
              "app/native_scope_paths.py",
              "app/s3_git_bundle_artifact.py",
              "app/native_gateway_commands.py",
              "tests/test_native_gateway_commands.py",
          }
          changed = set(subprocess.check_output(
              ["git","diff","--name-only","2480ba050784959bd5873a3425d2643e21fcdae1","HEAD"], text=True
          ).splitlines())
          if changed != expected:
              raise SystemExit("RULES219_SCOPE_MISMATCH")
          print("RULES219_SCOPE_OK",len(changed))
          PY
      - name: Positive, negative, replay and real Git fixture contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          RULES219_FIXTURE_ROOT: _rules219_fixture
        run: python3 -B -m unittest discover -v -s tests -p 'test_rules219_manifest_command.py'
      - name: Candidate read-only positive, negative and replay contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -v -s tests -p 'test_prepr_candidate_verifier.py'
      - name: Verify imported Rules 213 blobs and reviewed shared native core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              "app/native_one_shot.py": "1ceb5d08856781c538a837bc38dcb33e6b87c3c9",
              "app/rules213_native_adapter.py": "39c0deefc6420b7168e01d03053e0f9b71aa2da5",
              "app/rules213_updater_profile.py": "2a9bf55cc4987d7dc1eb1b05c536915755784a6f",
              "tests/test_rules213_fenced_mandatory.py": "3e9894b1ecca2e97c88957680fd23afefc55feca",
              "tests/test_rules213_native_adapter.py": "437696c0c1fe3ff47b201b60dc3bb7572f294aab",
              "tests/test_rules213_updater_profile.py": "bd87ce904459d05c2f0c120a6f170785d4869c29",
          }
          for path, blob_sha in sorted(expected.items()):
              observed = subprocess.check_output(
                  ["git", "hash-object", "--", path], text=True
              ).strip()
              if observed != blob_sha:
                  raise SystemExit("RULES213_SOURCE_BLOB_MISMATCH")
          print("RULES213_SOURCE_BLOBS_REVIEWED", len(expected), "shared_native_core_changed_for_scoped_noteri42")
          PY
      - name: Rules 213 native adapter and fencing positive/negative contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -v -s tests -p 'test_rules213*.py'
      - name: Typed Noteri 42 Gateway binding positive/negative before-claim gates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -v -s tests -p 'test_noteri42_native_binding.py'
      - name: Confirm only reviewed independent checkout remains untracked
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          entries = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=normal"],
              text=True,
          ).splitlines()
          if entries != ["?? _rules219_fixture/"]:
              raise SystemExit("RULES219_WORKTREE_STATUS_DRIFT")
          print("RULES219_INDEPENDENT_CHECKOUT_SCOPE_OK")
          PY

  desktop_candidate:
    name: Independent Desktop Git candidate audit (NOT Builder or Validator)
    if: github.repository == 'ericson-j-santos/engineering-worker-pool'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout shared pre-PR inspector at source SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify official Desktop main and repair branch by GitHub API
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            if (context.repo.owner !== 'ericson-j-santos' ||
                context.repo.repo !== 'engineering-worker-pool' ||
                context.ref !== 'refs/heads/feat/issue61-rules219-manifest-command-20261116') {
              throw new Error('PREPR_SOURCE_IDENTITY_INVALID');
            }
            const owner = 'ericson-j-santos';
            const repo = 'desktop-pc24x7-runtime';
            const base = '1ae2773bea5ffc8dba603d8ae3c07137ce345017';
            const head = '11cfdf12ad656a7595aba676132eccc309962ec4';
            const [info, main, candidate] = await Promise.all([
              github.rest.repos.get({owner, repo}),
              github.rest.repos.getBranch({owner, repo, branch: 'main'}),
              github.rest.repos.getBranch({
                owner, repo, branch: 'fix/orchestrator-isolated-backup-sha-3126'
              }),
            ]);
            if (info.data.private !== false || main.data.commit.sha !== base ||
                candidate.data.commit.sha !== head) {
              throw new Error('PREPR_DESKTOP_MAIN_OR_BRANCH_MOVED');
            }
      - name: Checkout independent Desktop candidate (immutable SHA, no credentials)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/desktop-pc24x7-runtime
          ref: 11cfdf12ad656a7595aba676132eccc309962ec4
          fetch-depth: 0
          path: _desktop_candidate
          persist-credentials: false
      - name: Inspect actual Git commits, scope, file bytes and patch SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from app.prepr_candidate_verifier import CandidateSpec, inspect_candidate
          expected = tuple(sorted((
              ".github/workflows/desktop-orchestrator-isolated-rollback.yml",
              "scripts/desktop_orchestrator_isolated_rollback.py",
              "tests/test_desktop_orchestrator_isolated_rollback.py",
              "tests/test_desktop_orchestrator_protected_state.py",
              "tests/test_desktop_orchestrator_shadow_service.py",
              "tests/test_orchestrator_recovery_owner_dispatch.py",
          )))
          spec = CandidateSpec(
              repository="ericson-j-santos/desktop-pc24x7-runtime",
              base_sha="1ae2773bea5ffc8dba603d8ae3c07137ce345017",
              head_sha="11cfdf12ad656a7595aba676132eccc309962ec4",
              observed_main_sha="1ae2773bea5ffc8dba603d8ae3c07137ce345017",
              observed_branch_sha="11cfdf12ad656a7595aba676132eccc309962ec4",
              allowed_paths=expected, expected_paths=expected,
          )
          report = inspect_candidate(Path("_desktop_candidate"), spec)
          if report["ready_for_pr"] is not False or report["cas_artifact_ref"] is not None:
              raise SystemExit("PREPR_FALSE_READY")
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Python 3.12 and exact existing Desktop test dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install only existing pinned CI test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 PyYAML==6.0.3 cryptography==50.0.2 boto3==1.43.115
      - name: Shared native executor and scoped Git-bundle CAS regressions
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_native_one_shot.py \
            tests/test_s3_git_bundle_artifact.py \
            tests/test_native_gateway_commands.py
      - name: Re-run real affected regressions on separate Desktop checkout
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cd _desktop_candidate
          python -m pytest -q -p no:cacheprovider \
            tests/test_desktop_orchestrator_isolated_rollback.py \
            tests/test_desktop_orchestrator_protected_state.py \
            tests/test_desktop_orchestrator_shadow_service.py \
            tests/test_orchestrator_recovery_owner_dispatch.py

      - name: Verify official Noteri issue 42 and pinned repair branch by GitHub API
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            if (context.repo.owner !== 'ericson-j-santos' ||
                context.repo.repo !== 'engineering-worker-pool' ||
                context.ref !== 'refs/heads/feat/issue61-rules219-manifest-command-20261116') {
              throw new Error('PREPR_NOTERI_SOURCE_IDENTITY_INVALID');
            }
            const owner = 'ericson-j-santos';
            const repo = 'noteri-runtime';
            const base = 'ce2be12647f27220a40d2ae39188d52f517f31df';
            const head = '6e462be66fd441c8997840324193ad0edc88e82a';
            const [info, main, candidate, issue] = await Promise.all([
              github.rest.repos.get({owner, repo}),
              github.rest.repos.getBranch({owner, repo, branch: 'main'}),
              github.rest.repos.getBranch({owner, repo,
                branch: 'fix/issue42-rules219-gateway-reason-20261119'}),
              github.rest.issues.get({owner, repo, issue_number: 42}),
            ]);
            if (info.data.private !== false || main.data.commit.sha !== base ||
                candidate.data.commit.sha !== head || issue.data.state !== 'open' ||
                issue.data.number !== 42 || issue.data.pull_request) {
              throw new Error('PREPR_NOTERI42_AUTHORITY_OR_SHA_DRIFT');
            }
      - name: Checkout independent Noteri 42 candidate at immutable SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/noteri-runtime
          ref: 6e462be66fd441c8997840324193ad0edc88e82a
          fetch-depth: 0
          path: _noteri_candidate
          persist-credentials: false
      - name: Inspect Noteri 42 source ancestry, exact paths and SHA-256 without promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from app.prepr_candidate_verifier import CandidateSpec, inspect_candidate
          expected = tuple(sorted((
              ".github/workflows/noteri-control-plane-probe.yml",
              "scripts/noteri_worker_pool_health_readonly.py",
              "tests/test_noteri_control_plane_fallback.py",
              "tests/test_noteri_rules219_readonly_admission.py",
              "tests/test_noteri_worker_pool_health_readonly.py",
          )))
          spec = CandidateSpec(
              repository="ericson-j-santos/noteri-runtime",
              base_sha="ce2be12647f27220a40d2ae39188d52f517f31df",
              head_sha="6e462be66fd441c8997840324193ad0edc88e82a",
              observed_main_sha="ce2be12647f27220a40d2ae39188d52f517f31df",
              observed_branch_sha="6e462be66fd441c8997840324193ad0edc88e82a",
              allowed_paths=expected, expected_paths=expected,
          )
          result = inspect_candidate(Path("_noteri_candidate"), spec)
          if (result["result"] != "CANDIDATE_INSPECTED" or
              result["changed_paths"] != list(expected) or
              result["read_only"] is not True or
              result["ready_for_pr"] is not False or
              result["model_calls_verified"] is not False or
              result["validator_independent_verified"] is not False or
              result["cas_artifact_ref"] is not None):
              raise SystemExit("PREPR_NOTERI42_FALSE_ATTESTATION")
          print(json.dumps(result, sort_keys=True))
          print("NOTERI42_CANDIDATE_READBACK_OK")
          PY
      - name: Independently execute Noteri 42 admission regressions in isolated checkout
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          (
            cd _noteri_candidate
            python3 -B -m unittest discover -v -s tests -p 'test_noteri_rules219_readonly_admission.py'
            python3 -B -m unittest discover -v -s tests -p 'test_noteri_worker_pool_health_readonly.py'
            python3 -B -m pytest -q -p no:cacheprovider tests/test_noteri_control_plane_fallback.py
            test -z "$(git status --porcelain --untracked-files=all)"
            test "$(git rev-parse HEAD)" = "6e462be66fd441c8997840324193ad0edc88e82a"
          )
          echo NOTERI42_INDEPENDENT_REGRESSION_OK
